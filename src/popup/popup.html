<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpEndSkipper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main id="popupContent" inert aria-busy="true">
      <h1>OpEndSkipper</h1>
      <p id="pageUrl" class="page-url">Завантаження URL…</p>

      <label class="toggle">
        <input id="enabled" type="checkbox">
        <span>Увімкнено для цієї сторінки</span>
      </label>

      <label for="skipStart">Пропустити на початку, с</label>
      <div class="input-row">
        <div class="time-value">
          <input id="skipStart" type="time" step="1" value="00:00:00">
          <span id="skipStartFraction" class="time-fraction" aria-label="Дробова частина секунди">.000</span>
        </div>
        <button id="useCurrentStart" class="secondary" type="button" title="Взяти поточний час відео">Поточний</button>
      </div>

      <label for="skipEnd">Пропустити наприкінці, с</label>
      <div class="input-row">
        <div class="time-value">
          <input id="skipEnd" type="time" step="1" value="00:00:00">
          <span id="skipEndFraction" class="time-fraction" aria-label="Дробова частина секунди">.000</span>
        </div>
        <button id="useCurrentEnd" class="secondary" type="button" title="Взяти час до завершення відео">Залишок</button>
      </div>

      <button id="save" class="primary" type="button">Зберегти для цього URL</button>

      <div class="transfer-actions" aria-label="Перенесення часових налаштувань">
        <button
          id="copySkipSettings"
          class="secondary compact"
          type="button"
          title="Копіювати часові налаштування"
          aria-label="Копіювати часові налаштування"
        >Копіювати</button>
        <button
          id="pasteSkipSettings"
          class="secondary compact"
          type="button"
          title="Вставити часові налаштування"
          aria-label="Вставити часові налаштування"
          disabled
        >Вставити</button>
      </div>

      <details id="urlFixerSection" class="fixer-section">
        <summary>URL-фіксери</summary>
        <fieldset id="urlFixerControls">
          <div class="fixer-toolbar">
            <button id="enableAllFixers" class="secondary compact" type="button">Увімкнути всі</button>
            <button id="disableAllFixers" class="secondary compact" type="button">Вимкнути всі</button>
          </div>

          <ol id="urlFixerList" class="fixer-list"></ol>
          <div id="addFixerForm"></div>
          <button id="addUrlFixer" class="secondary add-fixer" type="button">Додати правило</button>
        </fieldset>

        <div class="fixer-preview">
          <span>Поточний URL:</span>
          <code id="previewOriginalUrl"></code>
          <span>Ключ профілю:</span>
          <code id="previewProfileKey"></code>
          <p id="urlFixerWarning" class="fixer-warning" role="status"></p>
        </div>
      </details>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <div id="popupOverlay" class="popup-overlay" role="status" aria-live="polite">
      <div id="popupSpinner" class="popup-spinner" aria-hidden="true"></div>
      <p id="popupOverlayMessage">Завантаження URL…</p>
    </div>

    <script src="../shared/constants.js"></script>
    <script src="../shared/time.js"></script>
    <script src="../shared/url-fixers.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
